#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # Path to source
    alias __INSTALL_DIR__/;
    index index.html;

    try_files $uri $uri/ /index.html;

    # Set correct MJS mime type as it is an unknown filetype to Nginx which
    #   loads related files as 'application/octet-stream' type by default
    include mime.types;
    types {
        application/javascript js mjs;
    }

    location ~* \.html$ {
        expires 1h;
        more_set_headers "Cache-Control: public, must-revalidate";
        more_set_headers "Cross-Origin-Embedder-Policy: require-corp always";
        more_set_headers "Cross-Origin-Opener-Policy: same-origin always";
    }

    location ~* /libreoffice-wasm/soffice\.wasm\.gz$ {
        gzip off;
        types {} default_type application/wasm;
        more_set_headers "Content-Encoding: gzip";
        more_set_headers "Vary: Accept-Encoding";
        more_set_headers "Cache-Control: public, immutable";
        more_set_headers "Cross-Origin-Embedder-Policy: require-corp always";
        more_set_headers "Cross-Origin-Opener-Policy: same-origin always";
    }

    location ~* /libreoffice-wasm/soffice\.data\.gz$ {
        gzip off;
        types {} default_type application/octet-stream;
        more_set_headers "Content-Encoding: gzip";
        more_set_headers "Vary: Accept-Encoding";
        more_set_headers "Cache-Control: public, immutable";
        more_set_headers "Cross-Origin-Embedder-Policy: require-corp always";
        more_set_headers "Cross-Origin-Opener-Policy: same-origin always";
    }

    location ~* \.(wasm|wasm\.gz|data|data\.gz)$ {
        expires 1y;
        more_set_headers "Cache-Control: public, immutable";
        more_set_headers "Cross-Origin-Embedder-Policy: require-corp always";
        more_set_headers "Cross-Origin-Opener-Policy: same-origin always";
    }

    # Cache static assets
    location ~* \.(js|mjs|css|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        more_set_headers "Cache-Control: public, immutable";
        more_set_headers "Cross-Origin-Embedder-Policy: require-corp always";
        more_set_headers "Cross-Origin-Opener-Policy: same-origin always";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|mp4|webm)$ {
        expires 1y;
        more_set_headers "Cache-Control: public, immutable";
    }

    location ~* \.json$ {
        expires 1w;
        more_set_headers "Cache-Control: public, must-revalidate";
    }

    location ~* \.pdf$ {
        expires 1y;
        more_set_headers "Cache-Control: public, immutable";
    }

    # Security headers
    more_set_headers "X-Frame-Options: SAMEORIGIN always";
    more_set_headers "X-Content-Type-Options: nosniff always";
    more_set_headers "X-XSS-Protection: 1; mode=block always";
    more_set_headers "Cross-Origin-Opener-Policy: same-origin always";
    more_set_headers "Cross-Origin-Embedder-Policy: require-corp always";
    more_set_headers "Cross-Origin-Resource-Policy: cross-origin always";
}
