#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # Path to source
    alias __INSTALL_DIR__/;
    index index.html;

    try_files $uri $uri/ /index.html;

    # Custom GZIP settings (GZIP is already enabled in server's root nginx.conf)
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 1000;

    # Set correct mime type for file extensions unknown to Nginx
    include mime.types;
    types {
        application/wasm wasm;
        application/javascript js mjs;
        application/manifest+json webmanifest;
    }

    # Security headers
    more_set_headers "X-Frame-Options: SAMEORIGIN";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "X-XSS-Protection: 1; mode=block";

    # Required headers for SharedArrayBuffer (LibreOffice WASM)
    # These must be on every response - especially HTML pages
    more_set_headers "Cross-Origin-Opener-Policy: same-origin";
    more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
    more_set_headers "Cross-Origin-Resource-Policy: cross-origin";

    location ~* \.html$ {
        expires 1h;
        more_set_headers "Cache-Control: public, must-revalidate";
        more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
        more_set_headers "Cross-Origin-Opener-Policy: same-origin";
    }

    # Pre-compressed LibreOffice WASM binary
    location ~* /libreoffice-wasm/soffice\.wasm\.gz$ {
        gzip off;
        types {} default_type application/wasm;
        more_set_headers "Content-Encoding: gzip";
        more_set_headers "Vary: Accept-Encoding";
        more_set_headers "Cache-Control: public, immutable";
        more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
        more_set_headers "Cross-Origin-Opener-Policy: same-origin";
    }
    # Pre-compressed LibreOffice WASM data
    location ~* /libreoffice-wasm/soffice\.data\.gz$ {
        gzip off;
        types {} default_type application/octet-stream;
        more_set_headers "Content-Encoding: gzip";
        more_set_headers "Vary: Accept-Encoding";
        more_set_headers "Cache-Control: public, immutable";
        more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
        more_set_headers "Cross-Origin-Opener-Policy: same-origin";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|wasm)$ {
        expires 1y;
        more_set_headers "Cache-Control: public, immutable";
        more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
        more_set_headers "Cross-Origin-Opener-Policy: same-origin";
    }
}
