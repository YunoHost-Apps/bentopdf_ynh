#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    root __INSTALL_DIR__/dist/;
    index index.html;

    try_files $uri $uri/ __PATH__/index.html;
    more_set_headers "Cross-Origin-Embedder-Policy: 'require-corp' always";
    more_set_headers "Cross-Origin-Opener-Policy: 'same-origin' always";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 1000;

    # WASM MIME type
    types {
        application/wasm wasm;
    }

    # Required headers for SharedArrayBuffer (LibreOffice WASM)
    # These must be on every response - especially HTML pages
    more_set_headers "Cross-Origin-Embedder-Policy: 'require-corp' always";
    more_set_headers "Cross-Origin-Opener-Policy: 'same-origin' always";
    more_set_headers "Cross-Origin-Resource-Policy: 'cross-origin' always";

    # Security headers
    more_set_headers "X-Frame-Options: "SAMEORIGIN" always";
    more_set_headers "X-Content-Type-Options: 'nosniff' always";
    more_set_headers "X-XSS-Protection: '1; mode=block' always";

    # Pre-compressed LibreOffice WASM binary
    location ~* /libreoffice-wasm/soffice\.wasm\.gz$ {
        gzip off;
        types {} default_type application/wasm;
        more_set_headers "Content-Encoding: gzip";
        more_set_headers "Cache-Control: 'public, immutable'";
        more_set_headers "Cross-Origin-Embedder-Policy: 'require-corp' always";
        more_set_headers "Cross-Origin-Opener-Policy: 'same-origin' always";
    }

    # Pre-compressed LibreOffice WASM data
    location ~* /libreoffice-wasm/soffice\.data\.gz$ {
        gzip off;
        types {} default_type application/octet-stream;
        more_set_headers "Content-Encoding: gzip";
        more_set_headers "Cache-Control: 'public, immutable'";
        more_set_headers "Cross-Origin-Embedder-Policy: 'require-corp' always";
        more_set_headers "Cross-Origin-Opener-Policy: 'same-origin' always";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|wasm)$ {
        expires 1y;
        more_set_headers "Cache-Control: 'public, immutable'";
        more_set_headers "Cross-Origin-Embedder-Policy: 'require-corp' always";
        more_set_headers "Cross-Origin-Opener-Policy: 'same-origin' always";
    }
}