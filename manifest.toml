#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "bentopdf"
name = "BentoPDF"
description.en = "Privacy First PDF Toolkit"
description.fr = "Kit d'outils PDF Privacy First"

version = "2.8.7~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://bentopdf.com"
admindoc = "https://bentopdf.com/docs/self-hosting/"
code = "https://github.com/alam00000/bentopdf"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "250M"
ram.build = "0M"
ram.runtime = "150M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/alam00000/bentopdf/releases/download/v2.8.7/dist-simple-2.8.7.zip"
    sha256 = "f827a25b399edf26e3c73014fd4ea32d0774585d1f536f6201b8fce4a31bd334"
    format = "zip"
    extract = true
    in_subdir = false
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "dist-simple-.*\\.zip"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
